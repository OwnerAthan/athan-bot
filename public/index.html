<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athan BOT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: #111116;
      border: 1px solid #27272f;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px 20px;
      background: #15151c;
      border-bottom: 1px solid #27272f;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .status {
      color: #8d8d99;
      font-size: 13px;
      margin-top: 4px;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 14px;
      margin-bottom: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .bot {
      background: #1c1c24;
      margin-right: auto;
    }

    .user {
      background: #ffffff;
      color: #111;
      margin-left: auto;
    }

    .input-area {
      padding: 15px;
      background: #15151c;
      border-top: 1px solid #27272f;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #30303a;
      background: #0d0d12;
      color: white;
      outline: none;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">🤖 Athan BOT</div>
      <div class="status">AI Assistant • Online</div>
    </div>

    <div class="chat" id="chat">
      <div class="message bot">
        Halo! Saya Athan BOT 👋
        <br><br>
        Ada yang bisa saya bantu?
      </div>
    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Ketik pesan..."
        autocomplete="off"
      >

      <button id="sendButton">
        Kirim
      </button>
    </div>

  </div>

  <script>
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const chat = document.getElementById("chat");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");

      input.value = "";
      button.disabled = true;

      const loading = addMessage("Athan sedang berpikir...", "bot");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        loading.textContent =
          data.reply || data.error || "Terjadi kesalahan.";

      } catch (error) {
        loading.textContent =
          "Tidak dapat terhubung ke Athan BOT.";
      }

      button.disabled = false;
      input.focus();
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
  </html>
