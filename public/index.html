<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athan BOT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #09090d;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 70px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #24242c;
      background: #111117;
    }

    .menu-button {
      width: 44px;
      height: 44px;
      border: 1px solid #303039;
      border-radius: 12px;
      background: #18181f;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .header-title {
      flex: 1;
      text-align: center;
      margin-right: 44px;
      font-size: 17px;
      font-weight: bold;
    }

    .home {
      flex: 1;
      padding: 60px 20px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      max-width: 650px;
      margin: 0 auto 40px;
    }

    .welcome h1 {
      font-size: 40px;
      margin: 0 0 12px;
    }

    .welcome p {
      color: #9999a5;
      line-height: 1.7;
    }

    .grid {
      width: 100%;
      max-width: 780px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      min-height: 160px;
      padding: 22px;
      border: 1px solid #292932;
      border-radius: 18px;
      background: #15151c;
      color: white;
      text-align: left;
      cursor: pointer;
    }

    .card:hover {
      background: #1c1c25;
    }

    .icon {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .card h3 {
      margin: 0 0 8px;
    }

    .card p {
      margin: 0;
      color: #888894;
      font-size: 13px;
      line-height: 1.5;
    }

    .chat {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      margin-bottom: 12px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .bot {
      background: #181820;
      border: 1px solid #292932;
    }

    .user {
      margin-left: auto;
      background: white;
      color: black;
    }

    .input-area {
      display: none;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #292932;
      background: #111117;
    }

    .input-area input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #292932;
      background: #0c0c11;
      color: white;
      outline: none;
    }

    .send {
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 600px) {

      .welcome h1 {
        font-size: 30px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .card {
        min-height: 150px;
        padding: 16px;
      }

      .card h3 {
        font-size: 14px;
      }

      .card p {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">

      <button
        class="menu-button"
        onclick="showHome()"
      >
        ☰
      </button>

      <div class="header-title">
        Athan BOT
      </div>

    </header>


    <main
      class="home"
      id="home"
    >

      <div class="welcome">

        <h1>
          Halo 👋
        </h1>

        <p>
          Selamat datang di Athan BOT.
          Pilih AI yang ingin kamu gunakan.
        </p>

      </div>


      <div class="grid">

        <button
          class="card"
          onclick="openChat('assistant')"
        >

          <div class="icon">
            🤖
          </div>

          <h3>
            AI Assistant
          </h3>

          <p>
            Asisten AI untuk berbagai kebutuhan.
          </p>

        </button>


        <button
          class="card"
          onclick="openChat('image')"
        >

          <div class="icon">
            🎨
          </div>

          <h3>
            AI Gambar
          </h3>

          <p>
            Buat gambar berdasarkan prompt.
          </p>

        </button>


        <button
          class="card"
          onclick="openChat('coding')"
        >

          <div class="icon">
            💻
          </div>

          <h3>
            AI Coding
          </h3>

          <p>
            Bantuan membuat dan memperbaiki kode.
          </p>

        </button>


        <button
          class="card"
          onclick="openChat('curhat')"
        >

          <div class="icon">
            💬
          </div>

          <h3>
            AI Curhat
          </h3>

          <p>
            Tempat untuk bercerita dengan nyaman.
          </p>

        </button>


        <button
          class="card"
          onclick="openChat('question')"
        >

          <div class="icon">
            🧠
          </div>

          <h3>
            AI Tanya-Tanya
          </h3>

          <p>
            Tanyakan berbagai hal kepada Athan.
          </p>

        </button>

      </div>

    </main>


    <main
      class="chat"
      id="chat"
    ></main>


    <div
      class="input-area"
      id="inputArea"
    >

      <input
        id="messageInput"
        type="text"
        placeholder="Tulis pesan..."
      >

      <button
        class="send"
        onclick="sendMessage()"
      >
        Kirim
      </button>

    </div>

  </div>


  <script>

    let currentMode = "assistant";


    function showHome() {

      document.getElementById("home").style.display = "block";

      document.getElementById("chat").style.display = "none";

      document.getElementById("inputArea").style.display = "none";

    }


    function openChat(mode) {

      currentMode = mode;

      document.getElementById("home").style.display = "none";

      document.getElementById("chat").style.display = "block";

      document.getElementById("inputArea").style.display = "flex";

      const chat =
        document.getElementById("chat");

      chat.innerHTML = "";

      addMessage(
        "Halo 👋 Saya Athan BOT. Ada yang bisa saya bantu?",
        "bot"
      );

      document
        .getElementById("messageInput")
        .focus();

    }


    function addMessage(text, type) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent =
        text;

      document
        .getElementById("chat")
        .appendChild(message);

      document
        .getElementById("chat")
        .scrollTop =
        document.getElementById("chat").scrollHeight;

    }


    async function sendMessage() {

      const input =
        document.getElementById("messageInput");

      const text =
        input.value.trim();

      if (!text) {
        return;
      }

      addMessage(
        text,
        "user"
      );

      input.value = "";


      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: text,
                mode: currentMode
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          addMessage(
            typeof data.error === "string"
              ? data.error
              : "Terjadi kesalahan.",
            "bot"
          );

          return;

        }


        if (
          data.type === "image" &&
          data.image
        ) {

          const message =
            document.createElement("div");

          message.className =
            "message bot";


          const image =
            document.createElement("img");

          image.src =
            data.image;

          image.style.maxWidth =
            "100%";

          image.style.borderRadius =
            "12px";


          message.appendChild(image);

          document
            .getElementById("chat")
            .appendChild(message);

          return;

        }


        addMessage(
          data.reply ||
          "Athan tidak memberikan jawaban.",
          "bot"
        );


      } catch (error) {

        console.error(error);

        addMessage(
          "Tidak dapat terhubung ke server Athan BOT.",
          "bot"
        );

      }

    }


    document
      .getElementById("messageInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

          }

        }
      );


    showHome();

  </script>

</body>
</html>
