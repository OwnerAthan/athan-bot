<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Athan BOT</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;

  width: 100%;
  min-height: 100%;

  background: #08080c;

  color: white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body {
  min-height: 100vh;
}


/* =========================
   HEADER
========================= */

.header {

  height: 70px;

  display: flex;

  align-items: center;

  padding: 0 18px;

  background: #111116;

  border-bottom:
    1px solid #292930;

  position: relative;

  z-index: 20;
}


.menu-button {

  width: 44px;
  height: 44px;

  border: 1px solid #303038;

  border-radius: 12px;

  background: #18181f;

  color: white;

  font-size: 25px;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;
}


.menu-button:active {

  transform: scale(.95);

}


.header-title {

  position: absolute;

  left: 50%;

  transform: translateX(-50%);

  font-size: 18px;

  font-weight: bold;

}


/* =========================
   SIDEBAR
========================= */

.overlay {

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.55);

  z-index: 30;

  display: none;
}


.overlay.active {

  display: block;
}


.sidebar {

  position: fixed;

  top: 0;
  left: 0;

  width: 285px;

  height: 100vh;

  background: #111116;

  border-right:
    1px solid #292930;

  z-index: 40;

  transform:
    translateX(-100%);

  transition:
    transform .25s ease;

  padding: 20px 14px;

  overflow-y: auto;
}


.sidebar.active {

  transform:
    translateX(0);

}


.sidebar-top {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 5px 5px 20px;

  border-bottom:
    1px solid #292930;

  margin-bottom: 15px;
}


.sidebar-title {

  font-size: 19px;

  font-weight: bold;
}


.close-button {

  width: 38px;
  height: 38px;

  border: 1px solid #303038;

  border-radius: 10px;

  background: #18181f;

  color: white;

  font-size: 20px;

  cursor: pointer;
}


.menu-item {

  width: 100%;

  border: none;

  background: transparent;

  color: #ddd;

  padding: 14px;

  margin-bottom: 5px;

  border-radius: 11px;

  text-align: left;

  font-size: 14px;

  cursor: pointer;
}


.menu-item:hover {

  background: #1c1c23;

}


.menu-item.active {

  background: #24242d;

  color: white;

}


.menu-icon {

  display: inline-block;

  width: 28px;

  font-size: 17px;
}


.sidebar-divider {

  height: 1px;

  background: #292930;

  margin: 12px 5px;
}


/* =========================
   HOME
========================= */

.home {

  padding: 60px 20px;

  min-height:
    calc(100vh - 70px);

  overflow-y: auto;
}


.welcome {

  text-align: center;

  max-width: 650px;

  margin:
    20px auto 42px;
}


.welcome h1 {

  font-size: 40px;

  margin:
    0 0 12px;
}


.welcome p {

  color: #9999a5;

  line-height: 1.7;

  margin: 0;
}


.grid {

  width: 100%;

  max-width: 780px;

  margin: auto;

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 14px;
}


.card {

  min-height: 160px;

  padding: 22px;

  border:
    1px solid #292932;

  border-radius: 18px;

  background: #15151c;

  color: white;

  text-align: left;

  cursor: pointer;

  transition:
    transform .15s ease,
    background .15s ease;
}


.card:hover {

  background: #1c1c25;

  transform:
    translateY(-2px);
}


.icon {

  font-size: 28px;

  margin-bottom: 20px;
}


.card h3 {

  margin:
    0 0 8px;
}


.card p {

  margin: 0;

  color: #888894;

  font-size: 13px;

  line-height: 1.5;
}


/* =========================
   CHAT
========================= */

.chat {

  display: none;

  min-height:
    calc(100vh - 130px);

  overflow-y: auto;

  padding:
    20px 20px 100px;

  max-width: 850px;

  margin: auto;

  width: 100%;
}


.message {

  max-width: 85%;

  padding:
    13px 16px;

  margin-bottom: 12px;

  border-radius: 14px;

  line-height: 1.6;

  white-space: pre-wrap;

  word-break: break-word;
}


.bot {

  background: #181820;

  border:
    1px solid #292932;
}


.user {

  margin-left: auto;

  background: white;

  color: black;
}


/* =========================
   INPUT
========================= */

.input-area {

  display: none;

  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 15;

  gap: 8px;

  padding: 12px;

  background: #111117;

  border-top:
    1px solid #292932;
}


.input-area input {

  flex: 1;

  min-width: 0;

  padding: 13px;

  border-radius: 12px;

  border:
    1px solid #292932;

  background: #0c0c11;

  color: white;

  outline: none;
}


.send {

  padding:
    0 18px;

  border: none;

  border-radius: 12px;

  background: white;

  color: black;

  font-weight: bold;

  cursor: pointer;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .sidebar {

    width: 82vw;

    max-width: 310px;
  }


  .welcome {

    margin-top: 20px;
  }


  .welcome h1 {

    font-size: 30px;
  }


  .grid {

    grid-template-columns:
      repeat(2, 1fr);

    gap: 10px;
  }


  .card {

    min-height: 150px;

    padding: 16px;
  }


  .card h3 {

    font-size: 14px;
  }


  .card p {

    font-size: 11px;
  }


  .chat {

    padding:
      15px 12px 100px;
  }

}

</style>

</head>


<body>


<!-- SIDEBAR OVERLAY -->

<div
  class="overlay"
  id="overlay"
  onclick="closeSidebar()"
></div>


<!-- SIDEBAR -->

<aside
  class="sidebar"
  id="sidebar"
>

  <div class="sidebar-top">

    <div class="sidebar-title">
      Athan BOT
    </div>

    <button
      class="close-button"
      onclick="closeSidebar()"
    >
      ×
    </button>

  </div>


  <button
    class="menu-item active"
    onclick="showHome(); closeSidebar();"
  >

    <span class="menu-icon">⌂</span>

    Beranda

  </button>


  <button
    class="menu-item"
    onclick="openChat('assistant'); closeSidebar();"
  >

    <span class="menu-icon">🤖</span>

    AI Assistant

  </button>


  <button
    class="menu-item"
    onclick="openChat('image'); closeSidebar();"
  >

    <span class="menu-icon">🎨</span>

    AI Gambar

  </button>


  <button
    class="menu-item"
    onclick="openChat('coding'); closeSidebar();"
  >

    <span class="menu-icon">💻</span>

    AI Coding

  </button>


  <button
    class="menu-item"
    onclick="openChat('curhat'); closeSidebar();"
  >

    <span class="menu-icon">💬</span>

    AI Curhat

  </button>


  <button
    class="menu-item"
    onclick="openChat('question'); closeSidebar();"
  >

    <span class="menu-icon">🧠</span>

    AI Tanya-Tanya

  </button>


  <div class="sidebar-divider"></div>


  <button
    class="menu-item"
    onclick="alert('Settings akan kita buat setelah sistem chat stabil.')"
  >

    <span class="menu-icon">⚙️</span>

    Settings

  </button>


  <button
    class="menu-item"
    onclick="alert('Athan BOT — AI Assistant milik kamu.')"
  >

    <span class="menu-icon">ℹ️</span>

    Tentang Athan BOT

  </button>

</aside>


<!-- HEADER -->

<header class="header">

  <button
    class="menu-button"
    onclick="openSidebar()"
    aria-label="Buka menu"
  >
    ☰
  </button>


  <div class="header-title">
    Athan BOT
  </div>

</header>


<!-- HOME -->

<main
  class="home"
  id="home"
>

  <div class="welcome">

    <h1>
      Halo 👋
    </h1>

    <p>
      Selamat datang di Athan BOT.
      Pilih AI yang ingin kamu gunakan.
    </p>

  </div>


  <div class="grid">


    <button
      class="card"
      onclick="openChat('assistant')"
    >

      <div class="icon">🤖</div>

      <h3>
        AI Assistant
      </h3>

      <p>
        Asisten AI untuk berbagai kebutuhan.
      </p>

    </button>


    <button
      class="card"
      onclick="openChat('image')"
    >

      <div class="icon">🎨</div>

      <h3>
        AI Gambar
      </h3>

      <p>
        Buat gambar berdasarkan prompt.
      </p>

    </button>


    <button
      class="card"
      onclick="openChat('coding')"
    >

      <div class="icon">💻</div>

      <h3>
        AI Coding
      </h3>

      <p>
        Bantuan membuat dan memperbaiki kode.
      </p>

    </button>


    <button
      class="card"
      onclick="openChat('curhat')"
    >

      <div class="icon">💬</div>

      <h3>
        AI Curhat
      </h3>

      <p>
        Tempat untuk bercerita dengan nyaman.
      </p>

    </button>


    <button
      class="card"
      onclick="openChat('question')"
    >

      <div class="icon">🧠</div>

      <h3>
        AI Tanya-Tanya
      </h3>

      <p>
        Tanyakan berbagai hal kepada Athan.
      </p>

    </button>


  </div>

</main>


<!-- CHAT -->

<main
  class="chat"
  id="chat"
></main>


<!-- INPUT -->

<div
  class="input-area"
  id="inputArea"
>

  <input
    id="messageInput"
    type="text"
    placeholder="Tulis pesan..."
    autocomplete="off"
  >


  <button
    class="send"
    onclick="sendMessage()"
  >
    Kirim
  </button>

</div>


<script>

let currentMode = "assistant";


/* =========================
   SIDEBAR
========================= */

function openSidebar() {

  document
    .getElementById("sidebar")
    .classList.add("active");

  document
    .getElementById("overlay")
    .classList.add("active");

}


function closeSidebar() {

  document
    .getElementById("sidebar")
    .classList.remove("active");

  document
    .getElementById("overlay")
    .classList.remove("active");

}


/* =========================
   HOME
========================= */

function showHome() {

  document
    .getElementById("home")
    .style.display = "block";


  document
    .getElementById("chat")
    .style.display = "none";


  document
    .getElementById("inputArea")
    .style.display = "none";


}


/* =========================
   OPEN CHAT
========================= */

function openChat(mode) {

  currentMode = mode;


  document
    .getElementById("home")
    .style.display = "none";


  document
    .getElementById("chat")
    .style.display = "block";


  document
    .getElementById("inputArea")
    .style.display = "flex";


  const chat =
    document.getElementById("chat");


  chat.innerHTML = "";


  addMessage(
    "Halo 👋 Saya Athan BOT. Ada yang bisa saya bantu?",
    "bot"
  );


  document
    .getElementById("messageInput")
    .focus();

}


/* =========================
   MESSAGE
========================= */

function addMessage(text, type) {

  const message =
    document.createElement("div");


  message.className =
    "message " + type;


  message.textContent =
    text;


  document
    .getElementById("chat")
    .appendChild(message);


  const chat =
    document.getElementById("chat");


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   SEND
========================= */

async function sendMessage() {

  const input =
    document.getElementById("messageInput");


  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  addMessage(
    text,
    "user"
  );


  input.value = "";


  const loading =
    document.createElement("div");


  loading.className =
    "message bot";


  loading.textContent =
    "Athan sedang berpikir...";


  document
    .getElementById("chat")
    .appendChild(loading);


  try {

    const endpoint =
      currentMode === "image"
        ? "/api/image"
        : "/api/chat";


    const body =
      currentMode === "image"
        ? {
            prompt: text
          }
        : {
            message: text,
            mode: currentMode
          };


    const response =
      await fetch(
        endpoint,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );


    const data =
      await response.json();


    loading.remove();


    if (!response.ok) {

      addMessage(
        "❌ " +
        (
          data.error ||
          "Terjadi kesalahan pada server."
        ),
        "bot"
      );

      return;

    }


    if (
      data.type === "image" &&
      data.image
    ) {

      const message =
        document.createElement("div");


      message.className =
        "message bot";


      const image =
        document.createElement("img");


      image.src =
        data.image;


      image.style.maxWidth =
        "100%";


      image.style.borderRadius =
        "12px";


      message.appendChild(image);


      document
        .getElementById("chat")
        .appendChild(message);


      return;

    }


    addMessage(
      data.reply ||
      "Athan tidak memberikan jawaban.",
      "bot"
    );


  } catch (error) {

    console.error(error);


    loading.remove();


    addMessage(
      "❌ Tidak dapat terhubung ke server Athan BOT.",
      "bot"
    );

  }

}


/* =========================
   ENTER
========================= */

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


showHome();

</script>

</body>

</html>
